global:
    scrape_interval: 15s
    evaluation_interval: 15s

alerting:
    alertmanagers: []

rule_files: []
scrape_configs:
    - job_name: "prometheus"
      static_configs:
          - targets: ["prometheus:9090"]

    - job_name: "service-booking"
      static_configs:
          - targets: ["service-booking:8080"]
