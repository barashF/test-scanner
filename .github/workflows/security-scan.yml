name: DevSecOps Advanced Scan

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]

jobs:
    trivy-scan:
        name: Run Trivy with Reports
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # Шаг 1: Сканируем всё через ветку master официального экшена
            - name: Generate Security Report
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  scanners: "vuln,secret"
                  format: "sarif"
                  output: "trivy-results.sarif"

            # Шаг 2: Загружаем отчет в GitHub
            - name: Upload Trivy scan results to GitHub Security
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: "trivy-results.sarif"

            - name: Run Semgrep SAST
              uses: returntocorp/semgrep-action@v1
              continue-on-error: true
              with:
                  # p/golang — это встроенный набор правил для Go (включает поиск SQL-инъекций)
                  # p/security-audit — общие правила ИБ-аудита
                  config: p/golang p/security-audit
                  audit: true

            # Шаг 3: Жесткая проверка на HIGH и CRITICAL уязвимости через ветку master
            - name: Block on High/Critical
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  scanners: "vuln,secret"
                  severity: "HIGH,CRITICAL"
                  exit-code: "1"
