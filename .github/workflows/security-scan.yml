name: DevSecOps Advanced Scan

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]

jobs:
    trivy-scan:
        name: Run Trivy with Reports
        runs-on: ubuntu-latest
        # Даем пайплайну права на запись отчетов во вкладку Security
        permissions:
            security-events: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # Шаг 1: Сканируем ВСЁ и генерируем подробный отчет для вкладки Security (Мягкая проверка, не роняет пайплайн)
            - name: Generate Security Report
              uses: aquasecurity/trivy-action@0.28.0
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  scanners: "vuln,secret"
                  format: "sarif"
                  output: "trivy-results.sarif"

            # Шаг 2: Загружаем сгенерированный отчет в интерфейс GitHub (вкладка Security -> Code scanning)
            - name: Upload Trivy scan results to GitHub Security
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: "trivy-results.sarif"

            # Шаг 3: Жесткая проверка. Сканируем еще раз, но только на HIGH и CRITICAL уязвимости.
            # Если они найдутся — именно этот шаг выдаст exit-code 1 и заблокирует деплой.
            - name: Block on High/Critical
              uses: aquasecurity/trivy-action@0.28.0
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  scanners: "vuln,secret"
                  severity: "HIGH,CRITICAL"
                  exit-code: "1"
